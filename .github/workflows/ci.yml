name: CI

on:
  push:
    branches: [main, development, 'AI-automation', 'Backend-Foundation', 'Frontend']
  pull_request:
    branches: [main, development]

# Batalkan run lama saat ada push baru ke branch yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit test
        run: npx jest --ci --runInBand

      - name: Build
        run: npm run build

  e2e:
    name: Backend — E2E end-to-end
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: backend

    # PostgreSQL + Redis sungguhan agar E2E menguji rantai penuh
    # (auth → tiket → AI → SLA → CSAT). MinIO sengaja TIDAK disediakan:
    # aplikasi harus tetap boot dan hanya memberi peringatan bila storage
    # tidak tersedia. Tambahkan service minio di sini bila kelak ada uji
    # unggah lampiran.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-e2e-secret
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: helpdesk-attachments
      # AI dijalankan dalam mode mock agar tidak butuh API key.
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3001
      SWAGGER_ENABLED: 'false'
      # Alamat yang diuji oleh scripts/e2e.mjs.
      API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Migrasi database
        run: npx prisma migrate deploy

      - name: Seed data dasar
        run: npm run db:seed

      - name: Jalankan backend di latar belakang
        run: |
          node dist/main > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Tunggu backend siap
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "backend siap setelah ${i} detik"
              exit 0
            fi
            sleep 1
          done
          echo "backend tidak siap dalam 60 detik"
          tail -50 /tmp/backend.log
          exit 1

      - name: E2E end-to-end
        run: npm run test:e2e

      - name: Smoke test WebSocket (realtime)
        run: npm run test:ws

      - name: Log backend (bila gagal)
        if: failure()
        run: tail -80 /tmp/backend.log || true

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker — build image
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: helpdesk-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: helpdesk-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container backend
        run: |
          docker run -d --name backend-smoke -p 3000:3000 \
            -e DATABASE_URL="postgresql://helpdesk:helpdesk@host.docker.internal:5433/helpdesk" \
            -e REDIS_HOST=host.docker.internal \
            -e JWT_SECRET=ci-secret \
            -e JWT_REFRESH_SECRET=ci-refresh-secret \
            -e MINIO_ENDPOINT=host.docker.internal \
            -e MINIO_ACCESS_KEY=minioadmin \
            -e MINIO_SECRET_KEY=minioadmin123 \
            helpdesk-backend:ci
          # Beri waktu boot lalu pastikan container masih hidup.
          sleep 25
          docker ps --filter name=backend-smoke --format '{{.Status}}'
          docker logs backend-smoke --tail 30

      - name: Smoke test container frontend
        run: |
          docker run -d --name frontend-smoke -p 3001:3001 \
            -e PORT=3001 \
            helpdesk-frontend:ci
          sleep 15
          curl -fsS http://localhost:3001/login > /dev/null && echo "frontend OK"
          docker logs frontend-smoke --tail 20

      - name: Hapus container uji
        if: always()
        run: docker rm -f backend-smoke frontend-smoke || true